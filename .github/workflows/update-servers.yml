name: update-servers

on:
  schedule:
    # 每小时 17 分同步一次四社区服务器列表
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-servers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CloudflareWorker/package-lock.json

      - name: Install
        working-directory: CloudflareWorker
        run: npm ci --no-audit --no-fund

      # 脚本自己检测 token（SERVERS_GITHUB_TOKEN / GITHUB_TOKEN / GH_TOKEN），
      # 有就通过 GitHub Contents API 提交，没有就只写工作区；不依赖 git 凭据或 SSH key。
      - name: Sync Servers.json
        working-directory: CloudflareWorker
        env:
          SERVERS_GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:servers