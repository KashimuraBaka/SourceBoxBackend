name: update-servers

on:
  schedule:
    # 每小时 17 分同步一次四社区服务器列表
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-servers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CloudflareWorker/package-lock.json

      - name: Install
        working-directory: CloudflareWorker
        run: npm ci --no-audit --no-fund

      - name: Sync Servers.json
        working-directory: CloudflareWorker
        run: npm run sync:servers

      - name: Commit and push
        run: |
          if git diff --quiet -- Servers.json; then
            echo "Servers.json 无变化，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Servers.json
          git commit -m "chore(servers): 自动同步四社区服务器列表"
          git push